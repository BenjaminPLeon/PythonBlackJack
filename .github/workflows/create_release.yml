name: Create Release
on: 
    workflow_dispatch:
        inputs:
            tag_name:
                description: "name of the release"
                required: true
            draft:
                description: "is this release a draft?"
                required: true
                type: boolean
            prerelease:
                description: "is this release a prerelease?"
                required: true
                type: boolean


permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install pyinstaller

            - name: create executable
              working-directory: src
              run: |
                pyinstaller --onefile --name PythonBlackjack main.py
            
            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                generate_release_notes: true
                draft: ${{ inputs.draft }}
                prerelease: ${{ inputs.prerelease }}
                tag_name: ${{ inputs.tag_name }}
                tag_commitish: ${{ github.sha }}
                files:
                    src/dist/*.exe